<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Threads of Joy</title>
<link rel="icon" href="/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,700..850,100&family=Figtree:wght@400;700&family=Gochi+Hand&display=swap">
<style>
  :root { --paper: #fbf4ee; --ink: #34201a; --ink-soft: #5e4337; --rust: #9a4529; --stitch: #b65f3b; --on-rust: #fff6ef; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font-family: "Figtree", system-ui, sans-serif; padding: 24px max(20px, env(safe-area-inset-left, 0px)); text-align: center; }
  main { display: grid; gap: 1rem; justify-items: center; max-width: 30rem; }
  img { width: 120px; height: 120px; border-radius: 50%; transform: rotate(-6deg); }
  h1 { font-family: "Fraunces", Georgia, serif; font-variation-settings: "SOFT" 100; color: var(--rust); font-size: clamp(2rem, 7vw, 2.8rem); line-height: 1.1; margin: 0; }
  p { margin: 0; color: var(--ink-soft); line-height: 1.6; }
  .hand { font-family: "Gochi Hand", cursive; color: var(--rust); font-size: 1.3rem; }
  a { display: inline-block; margin-top: .5rem; padding: .85rem 1.4rem; border-radius: 999px; background: var(--rust); color: var(--on-rust); font-weight: 700; text-decoration: none; }
  a:focus-visible { outline: 2px dashed var(--rust); outline-offset: 4px; }
</style>
</head>
<body>
<main>
  <img src="/logo.png" alt="Threads of Joy logo">
  <p class="hand">Looks like this thread came loose.</p>
  <h1>We couldn't find that page</h1>
  <p>The link may be old or mistyped. Everything is on our home page.</p>
  <a href="/">Back to Threads of Joy</a>
</main>
</body>
</html>
